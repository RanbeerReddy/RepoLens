version: "3.8"

services:
  # ── Neo4j Graph Database ──────────────────────────────────────────
  neo4j:
    image: neo4j:5.20.0-community
    container_name: repolens-neo4j
    environment:
      - NEO4J_AUTH=neo4j/repolens_dev_password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
    ports:
      - "7474:7474" # Neo4j Browser UI
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p repolens_dev_password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── FastAPI Backend ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repolens-backend
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=repolens_dev_password
      - NEO4J_DATABASE=neo4j
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      - LLM_API_KEY=${LLM_API_KEY:-not-needed}
      - LLM_MODEL=${LLM_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8080
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
    ports:
      - "8080:8080"
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - repos_volume:/repositories:ro
    restart: unless-stopped

  # ── React Frontend ────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repolens-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  neo4j_data:
    driver: local
  repos_volume:
    driver: local
